server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Docker's DNS. Re-resolving "api" every few seconds means the proxy keeps working
  # after the API container is recreated (new IP).
  resolver 127.0.0.11 valid=5s;

  # API: /api/foo -> http://api:8000/foo
  location /api/ {
    set $api_upstream http://api:8000;
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass $api_upstream;
    proxy_set_header Host $host;
  }

  # Single page app: unknown paths serve index.html
  location / {
    try_files $uri /index.html;
  }
}
