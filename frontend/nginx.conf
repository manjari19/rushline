server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # API: /api/foo -> http://api:8000/foo
  location /api/ {
    proxy_pass http://api:8000/;
    proxy_set_header Host $host;
  }

  # Single page app: unknown paths serve index.html
  location / {
    try_files $uri /index.html;
  }
}
